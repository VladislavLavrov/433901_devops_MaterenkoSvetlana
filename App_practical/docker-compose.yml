services:
  mariadb:
    container_name: web-mariadb-9
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: webdb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5093:3306"
  web:
    container_name: web-app-calculator-9
    hostname: app
    build: Calculator/
    ports:
      - "0.0.0.0:5009:5009"