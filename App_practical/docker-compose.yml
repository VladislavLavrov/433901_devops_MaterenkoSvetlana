services:
  mariadb:
    container_name: web-mariadb-9
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: webdb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5093:3306"
    networks:
      - app-net

  web:
    container_name: web-app-calculator-9
    hostname: app
    build: Calculator/
    ports:
      - "0.0.0.0:5009:5009"
    depends_on:
      - mariadb
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24