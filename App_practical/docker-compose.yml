services:
  web:
    container_name: web-app-calculator-jenkins-9
    hostname: app
    build: Calculator/
    ports:
      - "0.0.0.0:5219:5009"
    networks:
      - app-net-jenkins

networks:
  app-net-jenkins:
    name: app-net-jenkins
    driver: bridge
    ipam:
      config:
        - subnet: 10.98.0.0/24